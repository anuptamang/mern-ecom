# Prometheus Alert Rules
# Define alerts for your e-commerce API

groups:
  - name: ecommerce_alerts
    interval: 30s
    rules:
      # High error rate alert
      - alert: HighErrorRate
        expr: rate(http_request_errors_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
          service: api
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value | humanize }} errors/second for the last 5 minutes"

      # Slow response time alert
      - alert: SlowResponseTime
        expr: |
          histogram_quantile(0.95, 
            rate(http_request_duration_seconds_bucket[5m])
          ) > 2
        for: 5m
        labels:
          severity: warning
          service: api
        annotations:
          summary: "Slow API response time"
          description: "P95 response time is {{ $value | humanize }} seconds (threshold: 2s)"

      # Very slow response time (critical)
      - alert: VerySlowResponseTime
        expr: |
          histogram_quantile(0.95, 
            rate(http_request_duration_seconds_bucket[5m])
          ) > 5
        for: 2m
        labels:
          severity: critical
          service: api
        annotations:
          summary: "Very slow API response time"
          description: "P95 response time is {{ $value | humanize }} seconds (threshold: 5s)"

      # High memory usage alert
      - alert: HighMemoryUsage
        expr: |
          (nodejs_nodejs_heap_size_used_bytes / nodejs_nodejs_heap_size_total_bytes) > 0.9
        for: 5m
        labels:
          severity: warning
          service: api
        annotations:
          summary: "High memory usage"
          description: "Memory usage is {{ $value | humanizePercentage }} (threshold: 90%)"

      # Critical memory usage
      - alert: CriticalMemoryUsage
        expr: |
          (nodejs_nodejs_heap_size_used_bytes / nodejs_nodejs_heap_size_total_bytes) > 0.95
        for: 2m
        labels:
          severity: critical
          service: api
        annotations:
          summary: "Critical memory usage"
          description: "Memory usage is {{ $value | humanizePercentage }} (threshold: 95%)"

      # High event loop lag
      - alert: HighEventLoopLag
        expr: nodejs_nodejs_eventloop_lag_seconds > 0.1
        for: 5m
        labels:
          severity: warning
          service: api
        annotations:
          summary: "High event loop lag"
          description: "Event loop lag is {{ $value | humanize }} seconds (threshold: 100ms)"

      # Critical event loop lag
      - alert: CriticalEventLoopLag
        expr: nodejs_nodejs_eventloop_lag_seconds > 0.5
        for: 2m
        labels:
          severity: critical
          service: api
        annotations:
          summary: "Critical event loop lag"
          description: "Event loop lag is {{ $value | humanize }} seconds (threshold: 500ms)"

      # High CPU usage
      - alert: HighCPUUsage
        expr: |
          rate(nodejs_process_cpu_seconds_total[5m]) > 0.8
        for: 5m
        labels:
          severity: warning
          service: api
        annotations:
          summary: "High CPU usage"
          description: "CPU usage is {{ $value | humanizePercentage }} (threshold: 80%)"

      # Service down (no metrics)
      - alert: ServiceDown
        expr: up{job="ecommerce-api"} == 0
        for: 1m
        labels:
          severity: critical
          service: api
        annotations:
          summary: "Service is down"
          description: "E-commerce API is not responding (no metrics received)"
