# Grafana Configuration
# Custom configuration to avoid port conflict with React frontend

[server]
# HTTP port (default is 3000, but React app uses 3000)
http_port = 3001

# Protocol (http or https)
protocol = http

# The public facing domain name used to access grafana from a browser
domain = localhost

# The full public facing url
root_url = %(protocol)s://%(domain)s:%(http_port)s/

[paths]
# Path to where grafana can store temp files, sessions, and the sqlite3 db (if used)
data = ./data
logs = ./logs
plugins = ./plugins
provisioning = ./provisioning

[log]
# Either "console", "file", "syslog". Default is console and  file
# Use comma to separate multiple modes, e.g. "console, file"
mode = console

# Either "debug", "info", "warn", "error", "critical", default is "info"
level = info

[security]
# disable creation of admin user on first start of grafana
disable_initial_admin_creation = false

# default admin user, created on startup
admin_user = admin

# default admin password, can be changed before first start of grafana,  or in profile settings
admin_password = admin

[users]
# disable user signup / registration
allow_sign_up = false

[datasources]
# Allow Grafana to use default datasources
allow_loading_unsigned_plugins = prometheus
